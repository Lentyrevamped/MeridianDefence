# Meridian OS camera: hide the ~48 raw Intel IPU6 capture nodes (PCI 00:05.0). They give no usable picture;
# apps get the camera through libcamera (one "Built-in camera" entry) instead.
monitor.v4l2.rules = [
  {
    matches = [
      { node.name = "~v4l2_input.pci-0000_00_05*" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
