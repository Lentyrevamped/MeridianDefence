name: meridian-os
on:
  schedule:
    - cron: "30 7 * * *"   # daily, after secureblue's own builds; picks up upstream fixes automatically
  push:
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  build:
    name: Build and sign Meridian OS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Build image
        uses: blue-build/github-action@v1.14
        with:
          recipe: recipe.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
