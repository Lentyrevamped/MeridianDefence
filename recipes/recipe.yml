# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Meridian OS: secureblue (hardened Fedora Atomic, GNOME, open NVIDIA) + Meridian branding and Ledger sign-in.
# Rule: only customise through stable hooks. Every Meridian piece must fail back to stock secureblue, never break boot or login.
name: meridian-os
description: Meridian OS, a branded secureblue for meridian2.
base-image: ghcr.io/secureblue/silverblue-nvidia-open-hardened
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf                    # daily-driver packages (Fedora repos only)
    install:
      packages:
        - rclone                 # Google Drive two-way sync (meridian-drive)
        - python3-cryptography   # Ledger signature check (meridian-ledger, GDM sign-in)

  - type: gschema-overrides
    include:
      - zz2-meridian.gschema.override  # zz2: must sort after secureblue's zz1-secureblue override (dock order)

  - type: script
    scripts:
      - 10-os-release.sh        # "Meridian OS" name (About page, boot menu entries), keeps ID=secureblue
      - 20-plymouth.sh          # boot splash + disk PIN prompt (stock TPM+PIN unlock), initramfs rebuilt; falls back to stock theme on any error
      - 30-gnome-extension.sh   # Ledger sign-in card + corporate shell style; each enabled only if it declares the image's GNOME version
      - 40-user-style.sh        # corporate GTK style per user (navy, square, blue accent), Flatpaks included (read-only)
      - 50-daily.sh             # daily driver: apps on first login, Drive sync timer, keep-screen-on, Brave policy
      - 60-ledger-login.sh      # Ledger-only GDM/lock screen sign-in, active only after `meridian-ledger enroll`; password stays at the TTY
      - 61-ledger-only-gdm.sh    # Ledger users: GDM fingerprint/smartcard services refuse (no bypass); others stock
      - 90-verify.sh            # build fails loudly if a stable piece is missing; fragile pieces only warn

  - type: signing                # signs the image (cosign) and adds our key to the image's container policy

  - type: script                 # after signing: merge our key into secureblue's own policy (keeps default reject)
    scripts:
      - 95-container-policy.sh
